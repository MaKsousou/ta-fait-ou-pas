<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>T’a fait ou pas ?</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d8e8b0;--fg:#1b2b12;--card:#f1f7da;--mut:#51693a;--ac:#d6336c;--bd:#1b2b12;--sh:#1b2b12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1330;--fg:#f4eefc;--card:#2a2050;--mut:#a99bd6;--ac:#ff5c8a;--bd:#f4eefc;--sh:#0b0718}}
:root[data-theme="dark"]{--bg:#1a1330;--fg:#f4eefc;--card:#2a2050;--mut:#a99bd6;--ac:#ff5c8a;--bd:#f4eefc;--sh:#0b0718}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;background:var(--bg);color:var(--fg);font:11px/1.8 "Press Start 2P","Courier New",monospace;image-rendering:pixelated;background-image:linear-gradient(var(--sh) 1px,transparent 1px),linear-gradient(90deg,var(--sh) 1px,transparent 1px);background-size:16px 16px;background-blend-mode:soft-light}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;line-height:1.4;margin:8px 0 6px;text-shadow:3px 3px 0 var(--ac)}p{color:var(--mut);margin:6px 0 16px}
.card{background:var(--card);border:4px solid var(--bd);box-shadow:6px 6px 0 var(--sh);padding:16px;margin:16px 0}
input{width:100%;padding:12px;border:4px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;margin:6px 0;outline:0}
input:focus{border-color:var(--ac)}
button{font:inherit;cursor:pointer;border:4px solid var(--bd);padding:14px 8px;width:100%;background:var(--ac);color:#fff;margin-top:10px;box-shadow:4px 4px 0 var(--sh)}
button:active{transform:translate(4px,4px);box-shadow:none}
button.alt{background:var(--card);color:var(--fg)}
.q{font-size:13px;line-height:1.7;min-height:130px;display:flex;align-items:center}
.bar{height:16px;border:4px solid var(--bd);background:var(--bg);margin-bottom:12px}.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ac) 0 8px,transparent 8px 10px)}
.row{display:flex;gap:12px}.row button{margin:10px 0 0}
.big{font-size:56px;color:var(--ac);text-align:center;margin:10px 0;text-shadow:4px 4px 0 var(--sh)}
.p{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:4px dotted var(--bd)}.p:last-child{border:0}
.me{color:var(--ac)}.tag{color:var(--mut);font-size:10px}
.av{width:34px;height:34px;border:3px solid var(--bd);object-fit:cover;image-rendering:pixelated;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle;color:var(--mut)}
#pv{width:80px;height:80px;margin:8px auto;font-size:26px;cursor:pointer;overflow:hidden;display:flex}
.logo{margin:8px 0 14px;text-align:center}.logo img{display:block;max-width:100%;max-height:230px;width:auto;height:auto;margin:0 auto;filter:drop-shadow(4px 4px 0 var(--sh))}.logo .d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .l{display:none}:root:not([data-theme="light"]) .logo .d{display:block}}
:root[data-theme="dark"] .logo .l{display:none}:root[data-theme="dark"] .logo .d{display:block}
#msgs{max-height:220px;min-height:60px;overflow-y:auto;margin:10px 0;padding:6px;border:4px solid var(--bd);background:var(--bg)}.m{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:10px;line-height:1.6}.m .av{width:28px;height:28px;margin:0;flex:none}.m b{color:var(--ac)}.m .t{word-break:break-word;min-width:0}
.hide{display:none!important}
